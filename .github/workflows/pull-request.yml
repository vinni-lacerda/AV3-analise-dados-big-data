name: Validar pull request

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validar-diff:
    name: validar-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar espacos e marcadores de conflito no diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
